// SDK 58's module plugin provides the shared Kotlin, SDK, and core dependencies.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.visionbgremover'
version = '1.0.0'

android {
  namespace "expo.modules.visionbgremover"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
  }
}
